<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ | ABD RC</title>
<meta name="description" content="Frequently asked questions about ABD RC's custom RC aircraft, UAV, FPV, repair, training and manufacturing services.">
<link rel="canonical" href="https://abdrc.wuaze.com/faq.html">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script type="application/ld+json" id="faq-schema">{}</script>
</head>
<body data-page="faq">
<a class="skip-link" href="#main">Skip to content</a>
<div class="bg-grid"></div><div class="bg-noise"></div>
<header id="site-header"></header>

<main id="main">
  <section class="page-header">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span>FAQ</span></div>
      <span class="eyebrow">Frequently Asked Questions</span>
      <h1>Answers before you ask</h1>
      <p>Can't find what you're looking for? <a href="contact.html" style="color:var(--accent);">Contact our team</a> directly.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="faq-list" id="faq-list" style="max-width:820px;margin:0 auto;"></div>
    </div>
  </section>

  <section class="section-sm" style="background:var(--bg-elevated);border-top:1px solid var(--border);">
    <div class="container">
      <div class="cta-band reveal">
        <h2>Still have questions?</h2>
        <p>Our team responds to most inquiries within one business day.</p>
        <div class="btn-group" style="justify-content:center;">
          <a href="contact.html" class="btn btn-primary">Contact Us</a>
          <a href="quote.html" class="btn btn-outline">Request a Quote</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>
<div id="float-stack" class="float-stack"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script src="js/forms.js"></script>
<script src="js/chat-widget.js"></script>
<script>
  document.getElementById('faq-list').innerHTML = ABD.faq.map((f,i) => `
    <div class="faq-item">
      <button class="faq-q">${f.q} ${ABD.icon('plus')}</button>
      <div class="faq-a"><p>${f.a}</p></div>
    </div>`).join('');

  document.getElementById('faq-schema').textContent = JSON.stringify({
    "@context":"https://schema.org", "@type":"FAQPage",
    "mainEntity": ABD.faq.map(f => ({ "@type":"Question","name":f.q,"acceptedAnswer":{"@type":"Answer","text":f.a}}))
  });
</script>
</body>
</html>
